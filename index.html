<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>EzAssign Blog – Study Abroad Guides for International Students</title>
    <meta name="description" content="EzAssign Blog: UK intakes, universities, visas, jobs, scholarships and student life guides for international students.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #0a0a0c;
            --mut: #64748b;
            --ln: #e2e8f0;
            --cd: #f8fafc;
            --bk: #0f172a;
            --or: #ff6a1a;
            --or-hover: #e55609;
            --pill-bg: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(226, 232, 240, 0.9);
            --card-shadow: 0 10px 30px -10px rgba(0,0,0,0.06);
            --card-shadow-hover: 0 20px 40px -15px rgba(0,0,0,0.12);
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #090d16;
                --fg: #f8fafc;
                --mut: #94a3b8;
                --ln: #1e293b;
                --cd: #0f172a;
                --bk: #020617;
                --or: #ff7a30;
                --or-hover: #ff6a1a;
                --pill-bg: rgba(15, 23, 42, 0.9);
                --glass-border: rgba(30, 41, 59, 0.9);
                --card-shadow: 0 10px 30px -10px rgba(0,0,0,0.3);
                --card-shadow-hover: 0 20px 40px -15px rgba(0,0,0,0.5);
                color-scheme: dark;
            }
        }

        :root[data-theme="dark"] {
            --bg: #090d16;
            --fg: #f8fafc;
            --mut: #94a3b8;
            --ln: #1e293b;
            --cd: #0f172a;
            --bk: #020617;
            --or: #ff7a30;
            --or-hover: #ff6a1a;
            --pill-bg: rgba(15, 23, 42, 0.9);
            --glass-border: rgba(30, 41, 59, 0.9);
            --card-shadow: 0 10px 30px -10px rgba(0,0,0,0.3);
            --card-shadow-hover: 0 20px 40px -15px rgba(0,0,0,0.5);
            color-scheme: dark;
        }

        * { box-sizing: border-box; }
        html { scroll-padding-top: 100px; scroll-behavior: smooth; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        a { color: inherit; text-decoration: none; }
        button, input, select, textarea { font: inherit; color: inherit; }

        header { position: sticky; top: 12px; z-index: 40; padding: 0 16px; }
        .pill {
            position: relative;
            max-width: 1180px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px 8px 24px;
            border-radius: 999px;
            border: 1px solid var(--glass-border);
            background: var(--pill-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08);
        }
        .brand { color: var(--or); font-weight: 800; font-size: 22px; letter-spacing: -.04em; display: flex; align-items: center; gap: 4px; cursor: pointer; }
        .bl {
            background: linear-gradient(135deg, var(--or), #ff9e66);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-left: 2px;
        }
        .links { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; }
        .links a {
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 600;
            color: var(--mut);
            border-radius: 99px;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .links a:hover { color: var(--fg); background: rgba(150,150,150,0.08); }
        .sp { flex: 1; }

        .btn {
            border: 1px solid var(--ln);
            background: transparent;
            color: var(--fg);
            border-radius: 99px;
            padding: 9px 20px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn:hover { background: var(--cd); border-color: var(--mut); }
        .btn.k { background: var(--fg); color: var(--bg); border-color: var(--fg); }
        .btn.k:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn.or { background: var(--or); color: #ffffff; border: none; outline: none; font-weight: 700; }
        .btn.or:hover { background: var(--or-hover); transform: translateY(-1px); }
        .btn.sm { padding: 6px 14px; font-size: 13px; }
        .btn.wide { width: 100%; padding: 12px; }
        .mb { display: none; }

        #mm { max-width: 1180px; margin: 8px auto 0; display: grid; position: relative; z-index: 39; }
        #mm:empty { display: none; }
        .mp {
            background: var(--bg);
            border: 1px solid var(--ln);
            border-radius: 24px;
            padding: 12px;
            width: min(280px, 100%);
            justify-self: end;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            animation: slideDown 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .mp a { display: block; padding: 10px 16px; border-radius: 14px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--fg); }
        .mp a:hover { background: var(--cd); }

        .hero { text-align: center; padding: 70px 18px 20px; overflow: hidden; position: relative; }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--cd);
            border: 1px solid var(--ln);
            color: var(--fg);
            padding: 6px 18px;
            border-radius: 99px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .badge:hover { border-color: var(--or); transform: scale(1.02); }
        .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--or); display: inline-block; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .hero h1 {
            font-size: clamp(40px, 7.5vw, 84px);
            line-height: 1.02;
            letter-spacing: -.04em;
            font-weight: 800;
            margin: 24px auto 18px;
            max-width: 16ch;
            background: linear-gradient(180deg, var(--fg) 0%, var(--mut) 140%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p { color: var(--mut); font-size: clamp(16px, 2vw, 20px); max-width: 54ch; margin: 0 auto 28px; font-weight: 400; line-height: 1.5; }

        .arc-wrap { max-width: 1180px; margin: 40px auto 0; padding: 0 20px; position: relative; }
        .arc { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; padding: 20px 4px 30px; -webkit-overflow-scrolling: touch; }
        .arc::-webkit-scrollbar { height: 8px; }
        .arc::-webkit-scrollbar-thumb { background: var(--ln); border-radius: 99px; }
        .ac {
            min-width: 240px;
            width: 240px;
            height: 300px;
            flex: none;
            scroll-snap-align: start;
            border-radius: 24px;
            color: #fff;
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .ac::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.85) 100%); z-index: 1; }
        .ac > * { position: relative; z-index: 2; }
        .ac:hover { transform: translateY(-8px); box-shadow: 0 25px 50px rgba(0,0,0,0.4); border-color: var(--or); }
        .ac em { font-style: normal; font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 8px; width: fit-content; backdrop-filter: blur(4px); }
        .ac b { font-size: 16px; line-height: 1.25; letter-spacing: -.02em; font-weight: 700; }

        .sec { max-width: 1180px; margin: 0 auto; padding: 64px 20px; }
        .big { font-size: clamp(32px, 4.5vw, 56px); letter-spacing: -.04em; line-height: 1.08; font-weight: 800; margin: 0 0 24px; max-width: 22ch; }
        .big i { font-style: normal; color: var(--mut); font-weight: 400; }
        .lbl { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--or); margin-bottom: 8px; }

        .bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 24px; }
        .bar h2 { margin: 0; flex: 1; min-width: 180px; font-size: 32px; letter-spacing: -.04em; font-weight: 800; }
        .in { width: 100%; border-radius: 16px; border: 1px solid var(--ln); background: var(--cd); color: var(--fg); padding: 12px 16px; margin-bottom: 12px; outline: none; transition: border-color 0.2s ease; }
        .in:focus { border-color: var(--or); }
        .bar .in { width: auto; min-width: 240px; margin: 0; border-radius: 99px; }

        .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
        .chip { border: 1px solid var(--ln); background: transparent; color: var(--mut); border-radius: 99px; padding: 8px 18px; cursor: pointer; font-weight: 600; font-size: 14px; transition: all 0.2s ease; }
        .chip:hover { color: var(--fg); background: var(--cd); }
        .chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }

        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .card {
            border: 1px solid var(--ln);
            border-radius: 28px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            background: var(--bg);
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
        }
        .card:hover { transform: translateY(-6px); box-shadow: var(--card-shadow-hover); border-color: var(--mut); }
        .cv { height: 180px; padding: 20px; color: #fff; display: flex; justify-content: space-between; align-items: flex-end; position: relative; overflow: hidden; background-size: cover; background-position: center; }
        .cv::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.7) 100%); }
        .cv > * { position: relative; z-index: 2; }
        .cv span { font-size: 64px; font-weight: 800; letter-spacing: -.06em; line-height: .9; opacity: .35; }
        .cv em { font-style: normal; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; opacity: .95; background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 8px; backdrop-filter: blur(4px); }
        .cb { padding: 22px; display: flex; flex-direction: column; flex: 1; }
        .cb h3 { margin: 8px 0; font-size: 20px; line-height: 1.3; letter-spacing: -.03em; font-weight: 700; }
        .cb p { margin: 0 0 16px; color: var(--mut); font-size: 14.5px; line-height: 1.55; flex: 1; }
        .cat { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--or); }
        .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .meta { font-size: 13px; color: var(--mut); font-weight: 500; }

        .integrations-sec { text-align: center; padding: 70px 20px; background: var(--cd); border-top: 1px solid var(--ln); border-bottom: 1px solid var(--ln); }
        .apps-container { display: flex; justify-content: center; align-items: center; gap: 18px; flex-wrap: wrap; max-width: 960px; margin: 36px auto 10px; }
        .app-card {
            width: 84px;
            height: 84px;
            border-radius: 24px;
            background: var(--bg);
            border: 1px solid var(--ln);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 24px -6px rgba(0,0,0,0.08);
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            text-decoration: none;
        }
        .app-card:hover { transform: translateY(-10px) scale(1.12); box-shadow: 0 20px 35px -8px rgba(0,0,0,0.18); border-color: var(--or); }
        .app-card i { font-size: 32px; color: var(--fg); }
        .app-card:hover i { color: var(--or); }

        details { border-bottom: 1px solid var(--ln); transition: all 0.2s ease; }
        details summary { list-style: none; padding: 22px 0; font-size: 20px; font-weight: 700; letter-spacing: -.02em; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        details summary::-webkit-details-marker { display: none; }
        details summary::after { content: "+"; color: var(--or); font-size: 24px; font-weight: 400; }
        details[open] summary::after { content: "–"; }
        details p { color: var(--mut); margin: 0 0 24px; max-width: 72ch; font-size: 16px; line-height: 1.6; }

        .pub-banner { max-width: 1180px; margin: 60px auto 0; padding: 0 20px; }
        .pub-card { background: #111827; color: #fff; border-radius: 36px; padding: 60px 40px; text-align: center; position: relative; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.3); }
        .pub-card h2 { font-size: clamp(28px, 4vw, 48px); font-weight: 800; letter-spacing: -.03em; margin: 12px 0 16px; }
        .pub-card p { color: #94a3b8; font-size: 16px; max-width: 54ch; margin: 0 auto 30px; }

        footer { background: #151517; color: #fff; margin-top: 60px; border-radius: 44px 44px 0 0; padding: 60px 0 32px; border-top: 1px solid #26262a; }
        .fg { max-width: 1180px; margin: 0 auto; padding: 0 20px; display: grid; grid-template-columns: 1.5fr repeat(4, 1fr); gap: 32px; }
        .fg h4 { margin: 0 0 14px; font-size: 14px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #94a3b8; }
        .fg a { display: block; color: #cbd5e1; font-size: 14.5px; padding: 4px 0; cursor: pointer; transition: color 0.2s ease; }
        .fg a:hover { color: var(--or); }
        .fg p { color: #94a3b8; font-size: 14px; margin: 12px 0 0; line-height: 1.6; }

        .social-icons { display: flex; gap: 12px; margin-top: 18px; }
        .social-btn { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 50%; background: #26262a; color: #cbd5e1; transition: all 0.2s ease; }
        .social-btn:hover { background: var(--or); color: #fff; transform: translateY(-2px); }
        .social-btn i { font-size: 16px; }

        .fb { max-width: 1180px; margin: 40px auto 0; padding: 24px 20px 0; border-top: 1px solid #26262a; color: #64748b; font-size: 13.5px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

        article.post { max-width: 780px; margin: 30px auto; padding: 0 20px; }
        .ph { border-radius: 36px; padding: 54px 36px; color: #fff; margin: 16px 0 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); background-size: cover; background-position: center; position: relative; }
        .ph h1 { font-size: clamp(30px, 5vw, 52px); line-height: 1.08; letter-spacing: -.04em; margin: 14px 0; font-weight: 800; }

        dialog { border: 1px solid var(--ln); border-radius: 32px; padding: 32px; width: min(520px, 92vw); background: var(--bg); color: var(--fg); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        dialog::backdrop { background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
        dialog h3 { margin: 0; font-size: 26px; letter-spacing: -.03em; font-weight: 800; }
        .empty { grid-column: 1/-1; color: var(--mut); text-align: center; padding: 48px; font-size: 18px; font-weight: 500; background: var(--cd); border-radius: 24px; border: 1px dashed var(--ln); }

        .tw table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 14.5px; }
        .tw th, .tw td { border: 1px solid var(--ln); padding: 12px 16px; text-align: left; }
        .tw th { background: var(--cd); font-weight: 700; }
        .call { background: var(--cd); border-left: 4px solid var(--or); padding: 16px 20px; border-radius: 0 16px 16px 0; margin: 24px 0; }
        .post-body h2 { font-size: 24px; font-weight: 700; margin-top: 36px; margin-bottom: 16px; }
        .post-body p { margin-bottom: 18px; line-height: 1.7; font-size: 16px; }
        .post-body img { max-width: 100%; border-radius: 16px; margin: 16px 0; }
        .post-body a { color: var(--or); text-decoration: underline; }

        @media(max-width: 880px) {
            .links { display: none; }
            .mb { display: inline-flex; }
            .bento, .grid { grid-template-columns: 1fr 1fr; }
            .fg { grid-template-columns: 1fr 1fr; }
        }
        @media(max-width: 580px) {
            .bento, .grid { grid-template-columns: 1fr; }
            .fg { grid-template-columns: 1fr; }
        }
    </style>
</head>

    <script>
        const A = [
            {
                id: 'uk-jan-2027-intake',
                cat: 'Admissions',
                e: '🎓',
                img: 'https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=800&q=80',

                d: 'Everything you need to know about starting a UK degree in January 2027.',
                dt: '1 Nov 2026',
                author: 'EzAssign Editorial Team',
                b: `<p>The January intake is the UK’s second main entry point. It is smaller than September, but it is ideal if you missed the autumn cycle, need extra time for English tests, or want to finish a one-year Master’s by the following winter.</p>

                <p>Mostly postgraduate (taught Master’s) applicants, plus a limited set of undergraduate and foundation programmes. Not every university or course offers a January start, so check each course page carefully.</p>

                <div class="tw"><table><tr><th>When</th><th>What to do</th></tr><tr><td>Now – Nov</td><td>Shortlist courses, book IELTS/PTE/TOEFL, prepare transcripts</td></tr><tr><td>Nov – early Dec</td><td>Submit applications, personal statement, references</td></tr><tr><td>Dec</td><td>Accept offer, pay deposit, receive CAS</td></tr><tr><td>Dec – Jan</td><td>Apply for Student visa, book accommodation, fly in</td></tr></table></div>

                <ul><li>Passport and academic transcripts</li><li>English test score (or an approved waiver)</li><li>Personal statement and CV</li><li>Two references where required</li><li>Proof of funds and, for some courses, ATAS clearance</li></ul>
                <div class="call"><b>Tip:</b> Many universities close January admissions early once courses fill, so apply as soon as your documents are ready.</div>
                <h2>Need help with coursework once you arrive?</h2>
                <p>EzAssign supports students with academic guidance, referencing and study skills so you can start strong.</p>`
            },
            {
                id: 'best-universities-uk',
                cat: 'Universities',
                e: '🏛️',
                img: 'https://images.unsplash.com/photo-1541339907198-e08756dedf3f?auto=format&fit=crop&w=800&q=80',
                t: 'Best Universities in the UK for International Students',
                d: 'A practical guide to top UK universities, how rankings work, and how to choose.',
                dt: '28 Oct 2026',
                author: 'Dr. Robert Chen',
                b: `<p>The UK is home to some of the world’s most recognised universities. But the “best” university is the one that fits your subject, budget, career goals and preferred city lifestyle.</p>
                <h2>Well-known research universities</h2>
                <ul><li><b>Oxford &amp; Cambridge</b> – collegiate, very competitive, strong across disciplines</li><li><b>Imperial College London</b> – engineering, science, medicine</li><li><b>UCL, King’s College London, LSE</b> – strong in London for law, economics, humanities, health</li><li><b>Edinburgh, Manchester, Warwick, Bristol</b> – high-ranking and popular with international students</li></ul>
                <h2>How to choose</h2>
                <ol><li>Check subject-level rankings, not only overall ones</li><li>Compare tuition and living costs by city</li><li>Look at graduate outcomes and employer links</li><li>Check scholarships, placement years and campus support</li></ol>
                <div class="call"><b>Remember:</b> Rankings use different methods. Use them as a starting point only.</div>`
            },
            {
                id: 'uk-student-visa-guide',
                cat: 'Visa',
                e: '🛂',

                        <div class="row">
                            <span class="meta">${esc(x.dt)}</span>
                            <span style="font-weight:700;color:var(--or);font-size:14px">Read Guide <i class="fa-solid fa-arrow-right"></i></span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function go(target, slugParam) {
            if(allPosts.some(x => x.id === target)) {
                state.page = 'post';
                state.slug = target;
            } else {
                state.page = target;
                state.slug = null;
            }
            render();
        }

        function toSec(id) {
            if(state.page !== 'home') {
                state.page = 'home';
                render();
            }
            setTimeout(() => {
                const el = document.getElementById(id);
                if(el) el.scrollIntoView({ behavior: 'smooth' });
            }, 50);
        }

        function setCat(c) {
            state.cat = c;
            const grid = $('#posts-grid');
            if(grid) grid.innerHTML = renderGrid();
            document.querySelectorAll('.chip').forEach(el => {
                el.classList.toggle('on', el.textContent.trim() === c);
            });
        }

        function onSearch(val) {
            state.q = val;
            const grid = $('#posts-grid');
            if(grid) grid.innerHTML = renderGrid();
        }

        function menu() {
            const mm = $('#mm');
            if(mm.innerHTML) {
                mm.innerHTML = '';
            } else {
                mm.innerHTML = `
                    <div class="mp">
                        <a onclick="toSec('art'); $('#mm').innerHTML=''">Articles</a>
                        <a onclick="go('uk-jan-2027-intake'); $('#mm').innerHTML=''">Jan 2027 Intake Guide</a>
                        <a onclick="go('support'); $('#mm').innerHTML=''">Support</a>
                        <a onclick="toSec('faq'); $('#mm').innerHTML=''">FAQ</a>
                        <a onclick="go('publish'); $('#mm').innerHTML=''">Publish Article</a>
                    </div>
                `;
            }
        }

        function insertTag(open, close) {
            const ta = $('#p-body');
            const start = ta.selectionStart;
            const end = ta.selectionEnd;
            const text = ta.value;
            ta.value = text.substring(0, start) + open + text.substring(start, end) + close + text.substring(end);
            ta.focus();
        }

        function insertImagePrompt() {
            const url = prompt('Enter Image URL:');
            if(url) {
                const ta = $('#p-body');
                ta.value += `\n<img src="${url}" alt="Article Image">\n`;
            }
        }

        function insertLinkPrompt() {
            const text = prompt('Enter link display text:');
            const url = prompt('Enter target URL:');
            if(text && url) {
                const ta = $('#p-body');
                ta.value += ` <a href="${url}" target="_blank">${text}</a> `;
            }
        }

        function submitPublishedArticle() {
            const author = $('#p-author').value.trim();
            const phone = $('#p-phone').value.trim();
            const email = $('#p-email').value.trim();
            const cat = $('#p-cat').value;
            const title = $('#p-title').value.trim();
            const img = $('#p-img').value.trim();
            const body = $('#p-body').value.trim();

            if(!author || !phone || !email || !title || !img || !body) {
                $('#pub-er').textContent = 'Please fill in all required fields before publishing.';
                return;
            }

            const newPost = {
                id: 'custom-' + Date.now(),
                cat: cat,
                e: '✍️',
                img: img,
                t: title,
                d: body.replace(/<[^>]*>?/gm, '').substring(0, 110) + '...',
                dt: '1 Nov 2026',
                author: author,
                b: `<div class="post-body">${body.replace(/\n/g, '<br>')}</div>`
            };

            const saved = st.g('ez_custom_posts', []);
            saved.unshift(newPost);
            st.s('ez_custom_posts', saved);
            allPosts.unshift(newPost);

            alertMsg('Your article has been successfully published on TOP of EzAssign Blog!');
            go('home');
        }

        function submitSupport() {
            const name = $('#sup-name').value.trim();
            const email = $('#sup-email').value.trim();
            const msg = $('#sup-msg').value.trim();
            if(!name || !email || !msg) { alertMsg('Please fill out all fields in the support form.'); return; }
            alertMsg('Thank you! Your enquiry has been submitted. Our advisor will reach out shortly.');
            $('#sup-name').value = ''; $('#sup-email').value = ''; $('#sup-msg').value = '';
        }

        // Theme Toggle
        $('#th').addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            st.s('ez_theme', next);
        });

        const savedTheme = st.g('ez_theme', null);
        if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

        initFooter();
        render();
    </script>
</body>
</html>
